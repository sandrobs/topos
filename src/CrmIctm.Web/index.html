<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080c5c" />
    <meta name="description" content="Formulário de acolhimento da Igreja Evangélica de Cristo" />
    <!--
      A Inter é descoberta só quando o CSS é interpretado. Pré-carregá-la aqui
      evita que o texto apareça na fonte do sistema e troque depois, o que
      desloca o layout. O Vite reescreve este caminho para o arquivo com hash
      em /assets/ no build.
    -->
    <link rel="preload" href="/src/fontes/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Ícones gerados da logo da igreja. Ficam em src/ e não em public/ porque o
      Caddy só libera /assets/* no domínio público dos formulários; o Vite
      publica estes caminhos lá, com hash.
    -->
    <link rel="icon" type="image/png" sizes="32x32" href="/src/icones/icone-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/icones/icone-180.png" />
    <title>Igreja Evangélica de Cristo</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
